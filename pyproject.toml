[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-bancario"
version = "1.0.0"
description = "Sistema bancario CLI com SQLite, testado com pytest/coverage"
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
]

[tool.setuptools]
py-modules = ["banco", "dados", "models", "relatorios", "security", "servico", "main"]
